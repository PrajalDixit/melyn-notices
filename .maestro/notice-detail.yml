appId: ${APP_ID}
env:
  APP_ID: com.melyn.notices
---
- runFlow: common/launch-without-failures.yml
- tapOn:
    id: "notice-card-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "notice-detail-title"
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- assertVisible:
    id: "notice-list-screen"
